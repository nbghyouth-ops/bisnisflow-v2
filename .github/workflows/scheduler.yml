name: scheduler
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub dapat menunda/melewatkan jadwal; itu normal
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Panggil /api/cron
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL (Variables) atau CRON_SECRET (Secrets) belum diisi"; exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/cron")
          echo "HTTP $code"
          case "$code" in 2??) ;; *) exit 1 ;; esac
